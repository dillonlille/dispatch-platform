schema_version: 1
id: cdf
display_name: Customer Delivery Feedback Collector
version: 0.3.1
summary: Broker-authenticated weekly CDF collection with exact-week validation and immutable publication.
owner:
  data: cdf
  team: Dispatch Operations
paths:
  source: src
  tests: tests
  database: <data-root>/cdf
  artifacts: <data-root>/cdf/artifacts
  staging: <data-root>/cdf/.staging
commands:
  test: ./tooling/test
  build: ./tooling/build
  verify: ./tooling/verify
  health: ./tooling/health
components:
  - id: cdf-collector
    kind: collector
    source: src
    capabilities:
      read_local_data: true
      mutate_data: true
      collect: true
      network: true
      authentication: true
      direct_delivery: false
      long_running: true
    coordinator_mode: cdf
retention:
  keep_current: true
  keep_rollback: 1
  preserve_pinned: true
