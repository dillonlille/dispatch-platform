name: Build tools and Rust cache
description: Pinned tools with separate release/debug caches, which only main refreshes.
inputs:
  profile:
    description: Cache partition, release or debug.
    required: true
  save:
    description: Allow this job to maintain the cache on main.
    default: 'true'
  skip-rust:
    description: Skip the Rust toolchain and caches; the job compiles nothing.
    default: 'false'
outputs:
  binary-key:
    description: Exact Rust input key for the release binary.
    value: ${{ steps.binary-key.outputs.key }}
  binary-hit:
    description: Whether the exact release binary cache was restored.
    value: ${{ steps.binary-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        cache: npm
    - run: npm ci --ignore-scripts
      shell: bash
    - run: rustup show active-toolchain
      if: inputs.skip-rust != 'true'
      shell: bash
    - name: Identify reusable release binary
      id: binary-key
      if: inputs.profile == 'release'
      shell: bash
      run: |
        python3 tooling/cargo-build.py --release --cache-key >> "$GITHUB_OUTPUT"
        echo "DISPATCH_CI_RUST_CACHE=$GITHUB_WORKSPACE/.ci-rust-cache" >> "$GITHUB_ENV"
    - name: Bind the selected Rust inputs
      if: steps.binary-key.outputs.key != ''
      shell: bash
      env:
        BINARY_KEY: ${{ steps.binary-key.outputs.key }}
      run: echo "DISPATCH_CI_RUST_KEY=$BINARY_KEY" >> "$GITHUB_ENV"
    - name: Restore exact release binary
      id: binary-cache
      if: steps.binary-key.outputs.key != '' && inputs.skip-rust != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci-rust-cache/
        key: dispatch-rust-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-key.outputs.key }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      if: inputs.skip-rust != 'true' && steps.binary-cache.outputs.cache-hit != 'true'
      with:
        shared-key: dispatch-${{ inputs.profile }}
        cache-bin: 'false'
        save-if: ${{ inputs.save == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
