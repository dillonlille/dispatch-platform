name: Shared caches
# Only main's caches reach every branch. This refills those the platform checks only
# restore, in a workflow of its own so a refill never holds up Dev or a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-caches
env:
  # Match the platform checks, so the Rust cache keys and build outputs are theirs.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  browsers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: keys
      - name: Restore the pinned Playwright browser
        id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.keys.outputs.playwright-key }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.playwright.outputs.cache-hit != 'true'
        with:
          node-version: 22.23.2
          cache: npm
      - name: Download the pinned Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Save the pinned Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.keys.outputs.playwright-key }}
      # Installing verifies the pinned checksum and size before the package is saved.
      - uses: ./.github/actions/setup-browseros
        id: browseros
      - name: Save the pinned BrowserOS package
        if: steps.browseros.outputs.package-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dispatch-browseros/browseros.deb
          key: dispatch-browseros-${{ hashFiles('tooling/browseros-release.json') }}
  # The build job compiles the release backend on the dependencies cached here. Main's own
  # runs reuse the PR's build, so without this job nothing would ever refresh them.
  release-dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: rust
        with:
          shared-key: dispatch-release
          cache-bin: 'false'
      - name: Compile the release build for its dependencies
        if: steps.rust.outputs.cache-hit != 'true'
        run: cargo build --locked --release
