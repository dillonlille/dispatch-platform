name: Platform checks
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run test:artifact
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Package verified Dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: tar -czf dispatch-dev.tar.gz -C .build .
      - name: Upload verified Dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-dev-${{ github.sha }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary verification data
        if: always()
        run: node tooling/clean-test-output.mjs
