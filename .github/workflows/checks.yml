name: Platform checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: platform-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.validation.outputs.mode }}
      # A PR from this repository into a trusted branch: its validation and build may be promoted.
      trusted-pr: ${{ github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main') && github.event.pull_request.head.repo.full_name == github.repository }}
      # Runs whose build is packaged for the final gate: trusted pushes and trusted PRs.
      candidate: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main') && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci-plan.py plan
  build:
    outputs:
      rust-key: ${{ steps.tools.outputs.binary-key }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse the verified PR build
        id: reuse
        if: needs.plan.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci-artifact.py
      - uses: ./.github/actions/setup-build
        id: tools
        with:
          profile: release
          skip-rust: ${{ steps.reuse.outputs.reused == 'true' }}
      - name: Build, dashboard tests and artifact checks
        if: steps.reuse.outputs.reused != 'true'
        run: npm run check:ci -- build-${{ needs.plan.outputs.mode }}
      - name: Smoke test the promoted build
        if: steps.reuse.outputs.reused == 'true'
        run: npm run test:smoke
      - name: Save trusted release binary
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.tools.outputs.binary-key != '' && steps.tools.outputs.binary-hit != 'true' && hashFiles('.ci-rust-cache/**/sha256') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-rust-cache/
          key: dispatch-rust-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.binary-key }}
      - name: Preserve workload measurements
        if: always() && needs.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/dispatch-rust-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Package runtime candidate
        if: needs.plan.outputs.candidate == 'true'
        run: tar -czf dispatch-dev.tar.gz -C .build .
      - name: Pass candidate to final gate
        if: needs.plan.outputs.candidate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 2
  core:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
      - name: Backend, API, dependency and Python checks
        run: npm run check:ci -- core
  collectors:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [paycom, paycom-recovery, cortex, capacity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - uses: ./.github/actions/setup-browseros
      - name: Native collector verification
        run: npm run test:browseros -- --shard ${{ matrix.shard }}
  # Keep one stable required check. No receipt or deployable artifact is published
  # until every required job has succeeded, including every collector shard.
  platform:
    needs: [plan, build, core, collectors, rust-advisories]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require complete validation
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tooling/ci-gate.py
      - name: Record PR validation
        if: needs.plan.outputs.trusted-pr == 'true'
        env:
          CI_RUST_KEY: ${{ needs.build.outputs.rust-key }}
        run: python3 tooling/ci-plan.py receipt --scope '${{ needs.plan.outputs.mode }}' --output "$RUNNER_TEMP/validation.json"
      - name: Upload PR validation
        if: needs.plan.outputs.trusted-pr == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Retrieve this run's runtime candidate
        if: needs.plan.outputs.candidate == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dispatch-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify candidate source and inventory
        if: needs.plan.outputs.candidate == 'true'
        run: python3 tooling/ci-gate.py --artifact dispatch-dev.tar.gz
      - name: Preserve the gated PR build
        if: needs.plan.outputs.trusted-pr == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-pr-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified branch build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-${{ github.ref_name }}-${{ github.sha }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 14

  rust-advisories:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache audit tool
        id: audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install audit tool
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
