name: Platform checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The main merge queue tests the exact merge commit it will push; that run's receipt and
  # build are what the following main push reuses.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # A newer push to a PR replaces its run. Every main commit keeps its own run: that run
  # publishes the build a release of that commit downloads.
  group: platform-checks-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.validation.outputs.mode }}
      # A PR from this repository into main, or a merge queue group of such PRs: its
      # validation and build may be promoted.
      trusted-pr: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
      # Runs whose build is packaged for the final gate: trusted pushes, groups and trusted PRs.
      candidate: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Select validation
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci-plan.py plan
  build:
    outputs:
      rust-key: ${{ steps.tools.outputs.binary-key }}
      # Named by the attempt that built it. Rerunning only failed jobs keeps this job's
      # outputs, so the shards and the gate still find the bytes this job uploaded.
      candidate-artifact: ${{ steps.candidate.outputs.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Reuse the verified PR build
        id: reuse
        if: needs.plan.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci-artifact.py
      - uses: ./.github/actions/setup-build
        id: tools
        with:
          profile: release
          skip-rust: ${{ steps.reuse.outputs.reused == 'true' }}
      - name: Build, dashboard tests and artifact checks
        if: steps.reuse.outputs.reused != 'true'
        env:
          # The browser suite runs as shard jobs against the packaged build below.
          DISPATCH_CI_BROWSER_SHARDS: '4'
        run: npm run check:ci -- build-${{ needs.plan.outputs.mode }}
      - name: Smoke test the promoted build
        if: steps.reuse.outputs.reused == 'true'
        run: npm run test:smoke
      - name: Save trusted release binary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.tools.outputs.binary-key != '' && steps.tools.outputs.binary-hit != 'true' && hashFiles('.ci-rust-cache/**/sha256') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-rust-cache/
          key: dispatch-rust-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.binary-key }}
      # Every run packages its build: browser shards and the workload benchmark test these
      # exact bytes, and trusted runs pass them to the final gate.
      - name: Package runtime candidate
        id: candidate
        run: |
          tar -czf dispatch-dev.tar.gz -C .build .
          echo "name=dispatch-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Pass candidate to browser shards and the final gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 2
  browser:
    needs: [plan, build]
    if: needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: tools
        with:
          fixture: 'true'
      - name: Restore the pinned Playwright browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.tools.outputs.playwright-key }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Retrieve this run's build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate-artifact }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.tools.outputs.fixture-hit != 'true'
        with:
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Browser suite shard ${{ matrix.shard }} of 4
        run: npm run check:ci -- browser ${{ matrix.shard }}/4
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  # The workload regression measures the packaged build on a runner of its own, alongside
  # the browser shards instead of ahead of them.
  benchmark:
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Retrieve this run's build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate-artifact }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - name: Rust workload regression
        run: npm run check:ci -- benchmark
      - name: Preserve workload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/dispatch-rust-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
  core:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
      - name: Backend, API, dependency and Python checks
        run: npm run check:ci -- core
  collectors:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [paycom, paycom-recovery, cortex, capacity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - uses: ./.github/actions/setup-browseros
      - name: Native collector verification
        run: npm run test:browseros -- --shard ${{ matrix.shard }}
  # Keep one stable required check. No receipt or deployable artifact is published
  # until every required job has succeeded, including every collector shard.
  platform:
    needs: [plan, build, browser, benchmark, core, collectors, rust-advisories]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Require complete validation
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tooling/ci-gate.py
      - name: Record PR validation
        if: needs.plan.outputs.trusted-pr == 'true'
        env:
          # A reuse receipt names the run whose bytes were reused, which means asking GitHub.
          GH_TOKEN: ${{ github.token }}
          CI_RUST_KEY: ${{ needs.build.outputs.rust-key }}
        run: python3 tooling/ci-plan.py receipt --scope '${{ needs.plan.outputs.mode }}' --output "$RUNNER_TEMP/validation.json"
      - name: Upload PR validation
        if: needs.plan.outputs.trusted-pr == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Retrieve this run's runtime candidate
        if: needs.plan.outputs.candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate-artifact }}
      - name: Verify candidate source and inventory
        if: needs.plan.outputs.candidate == 'true'
        run: python3 tooling/ci-gate.py --artifact dispatch-dev.tar.gz
      - name: Preserve the gated PR build
        if: needs.plan.outputs.trusted-pr == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-pr-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified branch build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-${{ github.ref_name }}-${{ github.sha }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          # A release downloads this build; keep it as long as GitHub allows.
          retention-days: 90

  # Every run builds the tools and fixture its inputs lack, off the critical path, and saves
  # them to its own ref's cache: the gate and the browser shards start later and restore
  # them instead of compiling. A PR's saves reach only that PR; main's reach every branch.
  # Every other job only restores them and builds with Cargo when they are absent, so a
  # failure here only costs time: it never fails the run, which Dev and releases require.
  tools:
    needs: plan
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: restore
        with:
          fixture: 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.tools-hit != 'true'
        with:
          shared-key: dispatch-release
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the planner, gate and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        run: |
          cargo build --locked --release -p dispatch-ci -p dispatch-host
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/tools
          install -m 700 "$target/release/dispatch-ci" "$target/release/dispatch-host" .ci-tools/tools/
      - name: Save the planner, gate and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/tools/
          key: ${{ steps.restore.outputs.tools-key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.fixture-hit != 'true'
        with:
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        run: |
          cargo build --locked --example assessment-fixture
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/fixture
          install -m 700 "$target/debug/examples/assessment-fixture" .ci-tools/fixture/
      - name: Save the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/fixture/
          key: ${{ steps.restore.outputs.fixture-key }}

  rust-advisories:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache audit tool
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install audit tool
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
