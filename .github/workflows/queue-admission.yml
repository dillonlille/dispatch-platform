name: Queue admission
# The ruleset requires the `platform` check on a PR before the merge queue accepts it, and the
# platform checks run only in the queue, on the squash commit. This reports that check on
# every PR head, so a PR can be queued as soon as it has run. It proves nothing itself: the
# queue's own `platform` gate decides whether the commit lands, and pr:ship waits for this
# check because a PR queued before it passed is dropped as an invalid merge commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Admitted to the merge queue, which runs the platform checks on the squash commit."
