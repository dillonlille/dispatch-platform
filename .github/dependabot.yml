version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types follow the Node version CI and the hosts run, not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Minor and patch releases arrive as one PR a week; majors stay apart.
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The RustCrypto crates share digest and crypto-common and only build together.
      rustcrypto:
        patterns: [aes-gcm, argon2, hmac, sha2]
      # Cargo treats a 0.x minor release as breaking, so only patches are grouped.
      cargo-patch:
        update-types: [patch]
  - package-ecosystem: github-actions
    # The composite actions pin the same actions as the workflows.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
