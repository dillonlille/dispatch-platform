[package]
name = "dispatch-ci"
version = "0.0.15"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
libc = "0.2"
