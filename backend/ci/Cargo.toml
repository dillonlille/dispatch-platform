# The platform version lives in package.json. Crate versions stay fixed so a release
# bump leaves the Rust inputs, and the cached release backend, unchanged.
[package]
name = "dispatch-ci"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
libc = "0.2"
fs2 = "0.4"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
