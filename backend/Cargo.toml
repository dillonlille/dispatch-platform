# The platform version lives in package.json. Crate versions stay fixed so a release
# bump leaves the Rust inputs, and the cached release backend, unchanged.
[package]
name = "dispatch-backend"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-only"

[dependencies]
dispatch-host = { path = "host" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "collation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
fs2 = "0.4"
getrandom = "0.4"
hmac = "0.13"
libc = "0.2"
icu_collator = "2"
sha2 = "0.11"
subtle = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
scraper = { version = "0.27", default-features = false }
ego-tree = "0.11"
html5ever = "0.39"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha1 = "0.11"
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tempfile = "3"
# Writes shared/contracts/generated from the response types; never part of the binary.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
