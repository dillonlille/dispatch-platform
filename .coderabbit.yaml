# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews only the PRs we ask it to: a `@coderabbitai review` comment on a PR
# labelled `ai-review`, which `npm run pr:ship` holds until the review is done and its threads
# are resolved.
reviews:
  profile: chill
  request_changes_workflow: false
  # The PR's title and body become the squash commit on main, so CodeRabbit leaves them alone.
  high_level_summary: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  # pr:ship reads the `CodeRabbit` commit status, which says "Review completed" once it is done.
  review_progress: false
  commit_status: true
  fail_commit_status: true
  auto_review:
    # Only a comment starts a review, and pushes after it are not reviewed again.
    enabled: false
    auto_incremental_review: false
  pre_merge_checks:
    docstrings:
      mode: 'off'
    title:
      mode: 'off'
    description:
      mode: 'off'
    issue_assessment:
      mode: 'off'
  path_filters:
    - '!package-lock.json'
    - '!Cargo.lock'
    - '!shared/contracts/generated/**'
